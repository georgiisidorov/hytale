# Ротация JSON-логов контейнеров Docker (driver json-file).
# Хранение: 7 ежедневных архивов ≈ 7 дней.
#
# Установка на сервере:
#   sudo cp logrotate-docker-hytale.conf /etc/logrotate.d/docker-hytale
#   sudo chmod 644 /etc/logrotate.d/docker-hytale
#   sudo logrotate -d /etc/logrotate.d/docker-hytale   # проверка (dry-run)
#   sudo logrotate -f /etc/logrotate.d/docker-hytale  # принудительно один раз
#
# copytruncate — обрезать файл после копии, чтобы не ломать поток записи Docker.

/var/lib/docker/containers/*/*-json.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}