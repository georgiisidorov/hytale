services:
  telegram-countdown:
    build: .
    container_name: hytale-telegram-countdown
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
      - STATE_PATH=/data/state.json
      - TELEGRAM_SESSION_PATH=/data/session
      - TELEGRAM_GROUP_ID=${TELEGRAM_GROUP_ID:--5118253176}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - COUNTDOWN_TARGET=${COUNTDOWN_TARGET:-2026-06-05T21:00:00}
      - TICK_INTERVAL_SECONDS=${TICK_INTERVAL_SECONDS:-300}
      - TZ=${TZ:-Europe/Moscow}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY:-}
    volumes:
      - ./data:/data
